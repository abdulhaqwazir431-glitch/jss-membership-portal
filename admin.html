
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSS Admin Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 30px 16px;
    }
    .box {
      max-width: 400px;
      margin: 50px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0001;
    }
    h2 { text-align: center; color: #14532d; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #166534;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="box">
    <h2>JSS Admin Portal</h2>
    <p>Authorized administrators only.</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Admin email" required>
      <input id="password" type="password"
        placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://irxaejcuwrpjithegxhy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8ZNlvAzSCooLCmv4GwGkWA_V-vtJl-R";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    document.getElementById("loginForm")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        const message = document.getElementById("message");
        message.textContent = "Signing in...";

        const { data, error } = await db.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) {
          message.textContent = "Login failed: " + error.message;
          return;
        }

        const { data: admin, error: adminError } = await db
          .from("jss_admins")
          .select("active")
          .eq("user_id", data.user.id)
          .eq("active", true)
          .maybeSingle();

        if (adminError || !admin) {
          await db.auth.signOut();
          message.textContent =
            "Access denied. This account is not an active JSS admin.";
          return;
        }

        message.textContent =
          "Admin login successful! Dashboard is ready for the next step.";
      });
  </script>
</body>
</html>
