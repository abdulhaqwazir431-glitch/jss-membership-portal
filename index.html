<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSS Membership Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 30px 15px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0001;
        }
        h1 { color: #12345a; }
        p { color: #555; line-height: 1.6; }
        .notice {
            background: #fff5d9;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            background: #12345a;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JANIKHEL STUDENTS SOCIETY</h1>
        <h2>Digital Membership Portal</h2>

        <p>
            Welcome to the official digital membership
            portal of Janikhel Students Society (JSS).
        </p>

        <div class="notice">
            Membership applications are subject to
            verification and approval by JSS administration.
        </div>

        <p>Our mission: Education, Unity and Service.</p>

        <button onclick="alert('Membership registration will be available soon!')">
            Membership Registration
        </button>
    </div>
</body>
</html>
